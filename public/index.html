<body>
  <noscript>You need to enable JavaScript to run this portfolio.</noscript>
  <div id="root"></div>

  <!-- Boot splash: overlays the app until React mounts, then slides
       out smoothly. Chunky brutalist panel: thick border, hard
       shadow, bungee percentage counter and a striped fill bar. -->
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-card">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" class="boot-rocket" style="display: block; margin: 0 auto;">
        <path d="M25 16 L32 4 L39 16 Z" fill="#FFD23F" stroke="#17181C" stroke-width="2.6" stroke-linejoin="round" />
        <rect x="24" y="16" width="16" height="28" rx="5" fill="#04A777" stroke="#17181C" stroke-width="2.6" />
        <circle cx="32" cy="27" r="4.6" fill="#FFFFFF" stroke="#17181C" stroke-width="2.4" />
        <path d="M24 34 C 19 39, 19 46, 22 50 L 25 45 Z" fill="#38B6FF" stroke="#17181C" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M40 34 C 45 39, 45 46, 42 50 L 39 45 Z" fill="#38B6FF" stroke="#17181C" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M27 44 L32 58 L37 44 L32 46 Z" fill="#FF6B6B" stroke="#17181C" stroke-width="2.2" stroke-linejoin="round" />
      </svg>
      <div class="boot-label">LOADING PORTFOLIO</div>
      <div class="boot-count" id="boot-count">0%</div>
      <div class="boot-bar">
        <div class="boot-bar-fill" id="boot-fill"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var fill = document.getElementById("boot-fill");
      var count = document.getElementById("boot-count");
      var boot = document.getElementById("boot");
      var root = document.getElementById("root");
      var pct = 0;
      var appMounted = false;
      var exited = false;

      var paint = function () {
        fill.style.width = pct + "%";
        count.textContent = Math.floor(pct) + "%";
      };

      var finish = function () {
        if (exited) return;
        exited = true;
        fill.style.width = "100%";
        count.textContent = "100%";
        setTimeout(function () {
          boot.classList.add("boot-done");
          setTimeout(function () {
            if (boot && boot.parentNode) {
              boot.parentNode.removeChild(boot);
            }
          }, 620);
        }, 240);
      };

      var interval = setInterval(function () {
        if (appMounted) return;
        pct += Math.random() * 6 + 1.5;
        if (pct > 92) pct = 92;
        paint();
      }, 170);

      // As soon as React paints anything, finish the count and exit.
      var observer = new MutationObserver(function () {
        if (!appMounted && root.childElementCount) {
          appMounted = true;
          clearInterval(interval);
          finish();
        }
      });
      observer.observe(root, { childList: true, subtree: true });

      // Safety net: never hold the screen hostage.
      setTimeout(function () {
        if (!appMounted) {
          pct = 89;
          paint();
        }
      }, 6000);
    })();
  </script>
